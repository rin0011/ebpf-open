name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            pkg-config \
            libelf-dev \
            zlib1g-dev \
            wget \
            unzip \
            make
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      
      - name: Install Android NDK
        run: |
          mkdir -p ~/ndk
          cd ~/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          echo "NDK_PATH=$HOME/ndk/android-ndk-r28c" >> $GITHUB_ENV
      
      - name: Grant execute permissions
        run: |
          chmod +x ./setup_ndk_sysroot.sh
          chmod +x ./build_android.sh
          chmod +x ./build_magisk.sh
          chmod +x ./build_musl.sh
      
      - name: Update NDK paths in scripts
        run: |
          sed -i "s|NDK=/home/root/ndk/android-ndk-r28c|NDK=$HOME/ndk/android-ndk-r28c|g" ./setup_ndk_sysroot.sh
          sed -i "s|NDK=/home/root1/ndk/android-ndk-r28c|NDK=$HOME/ndk/android-ndk-r28c|g" ./build_android.sh
          sed -i "s|MUSL_CROSS=/home/root1/aarch64-linux-musl-cross|MUSL_CROSS=$HOME/musl-cross|g" ./build_musl.sh
      
      - name: Setup NDK Sysroot
        run: |
          echo "=== Setting up NDK Sysroot ==="
          ./setup_ndk_sysroot.sh
        working-directory: ${{ github.workspace }}
        env:
          RUST_BACKTRACE: full
      
      - name: Verify sysroot files
        run: |
          echo "=== Checking sysroot contents ==="
          echo "Libs:"
          ls -lah sysroot/lib/
          echo ""
          echo "Includes:"
          ls -lah sysroot/include/
          echo ""
          echo "=== Environment check ==="
          which clang
          which llvm-ar
          which make
        working-directory: ${{ github.workspace }}
      
      - name: Build Android binary
        run: |
          echo "=== Building for Android (aarch64-linux-android) ==="
          echo "NDK: $NDK_PATH"
          echo "SYSROOT_DIR: $(pwd)/sysroot"
          ./build_android.sh
        working-directory: ${{ github.workspace }}
        env:
          RUST_BACKTRACE: full
          VERBOSE: 1
      
      - name: Verify Android build output
        run: |
          echo "=== Android build output ==="
          ls -lah dist/
          file dist/ebpf-open-android || echo "Binary not found"
        working-directory: ${{ github.workspace }}
      
      - name: Setup Magisk dependencies
        run: |
          mkdir -p ~/musl-cross
          cd ~/musl-cross
          echo "Downloading musl-cross toolchain..."
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz --strip-components=1
          echo "MUSL_CROSS=$HOME/musl-cross" >> $GITHUB_ENV
      
      - name: Setup Magisk sysroot (musl)
        run: |
          echo "=== Setting up musl sysroot ==="
          PROJECT_DIR="$(pwd)"
          SYSROOT_DIR="$PROJECT_DIR/sysroot-musl"
          mkdir -p "$SYSROOT_DIR/lib" "$SYSROOT_DIR/include"
          
          # Copy libelf and libz for musl
          if [ -f "$PROJECT_DIR/sysroot/lib/libelf.a" ]; then
            cp "$PROJECT_DIR/sysroot/lib/libelf.a" "$SYSROOT_DIR/lib/"
            cp "$PROJECT_DIR/sysroot/include/libelf.h" "$SYSROOT_DIR/include/"
            cp "$PROJECT_DIR/sysroot/include/gelf.h" "$SYSROOT_DIR/include/"
          fi
          
          if [ -f "$PROJECT_DIR/sysroot/lib/libz.a" ]; then
            cp "$PROJECT_DIR/sysroot/lib/libz.a" "$SYSROOT_DIR/lib/"
            cp "$PROJECT_DIR/sysroot/include/zlib.h" "$SYSROOT_DIR/include/"
            cp "$PROJECT_DIR/sysroot/include/zconf.h" "$SYSROOT_DIR/include/"
          fi
          
          # Also include elf.h
          if [ -f "$PROJECT_DIR/sysroot/include/elf.h" ]; then
            cp "$PROJECT_DIR/sysroot/include/elf.h" "$SYSROOT_DIR/include/"
          fi
          
          echo "musl sysroot contents:"
          ls -lah "$SYSROOT_DIR/lib/"
          ls -lah "$SYSROOT_DIR/include/"
        working-directory: ${{ github.workspace }}
      
      - name: Build Magisk module
        run: |
          echo "=== Building Magisk module ==="
          echo "MUSL_CROSS: $MUSL_CROSS"
          ./build_magisk.sh --build
        working-directory: ${{ github.workspace }}
        env:
          RUST_BACKTRACE: full
          VERBOSE: 1
      
      - name: Verify all outputs
        run: |
          echo "=== Final build artifacts ==="
          ls -lah dist/
        working-directory: ${{ github.workspace }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-open-builds
          path: dist/
          if-no-files-found: error
