name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      
      - name: Install Android NDK
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk-r28c-linux.zip
          mkdir -p /home/root/ndk
          mv android-ndk-r28c /home/root/ndk/
      
      - name: Grant execute permissions
        run: |
          chmod +x ./setup_ndk_sysroot.sh
          chmod +x ./build_android.sh
          chmod +x ./build_magisk.sh
          chmod +x ./build_musl.sh
      
      - name: Setup NDK Sysroot
        run: ./setup_ndk_sysroot.sh
        working-directory: ${{ github.workspace }}
      
      - name: Build Android
        run: ./build_android.sh
        working-directory: ${{ github.workspace }}
      
      - name: Build Magisk Module
        run: ./build_magisk.sh --build
        working-directory: ${{ github.workspace }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-open-builds
          path: dist/
          if-no-files-found: error
